<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Fitness Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="landing-shell">
      <div class="landing-glow"></div>
      <img src="assets/hero-athlete.png" alt="" class="landing-hero-img" />
      <div class="landing-brand-sub landing-corner-brand">Fitness Center</div>

      <div class="auth-panel-wrap">
        <div class="auth-panel">
          <h2 class="auth-panel-title">Create your account</h2>

          <div class="session-gate-error" id="error" hidden></div>

          <form id="register-form">
            <div class="underline-field">
              <label for="full_name">Full name</label>
              <input id="full_name" required />
            </div>
            <div class="underline-field">
              <label for="reg-email">Email</label>
              <input id="reg-email" type="email" required />
            </div>
            <div class="underline-field">
              <label for="reg-password">Password</label>
              <input id="reg-password" type="password" minlength="6" required />
            </div>

            <button class="btn btn-accent full" id="submit-btn" style="margin-top: 6px">Sign Up</button>
          </form>

          <p class="landing-signup" style="margin-top: 18px">
            Already have an account? <a href="login.html">Log In</a>
          </p>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/register.js"></script>
  </body>
</html>
