<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — Fitness Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="landing-shell">
      <div class="landing-glow"></div>
      <img src="assets/hero-athlete.png" alt="" class="landing-hero-img" />
      <div class="landing-brand-sub landing-corner-brand">Fitness Center</div>

      <div class="auth-panel-wrap">
        <div class="auth-panel">
          <h2 class="auth-panel-title">Welcome Back!</h2>

          <div class="session-gate-error" id="error" hidden></div>

          <form id="login-form">
            <div class="underline-field">
              <label for="email">Username or Email</label>
              <input id="email" name="email" type="email" required />
            </div>
            <div class="underline-field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required />
            </div>

            <div class="auth-row-between">
              <label class="checkbox-label">
                <input type="checkbox" id="remember" checked />
                Remember me
              </label>
              <button type="button" class="link-accent" id="forgot-btn">Forgot password?</button>
            </div>

            <p class="field-hint" id="forgot-note" hidden style="margin-bottom: 14px">
              Password resets aren't self-service yet — contact the front desk to have yours reset.
            </p>

            <button class="btn btn-accent full" id="submit-btn" style="margin-top: 6px">Log In</button>
          </form>

          <p class="landing-signup" style="margin-top: 18px">
            Don't have an account? <a href="register.html">Sign Up</a>
          </p>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/login.js"></script>
  </body>
</html>
