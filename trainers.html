<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trainers | Fitness Center</title>
  <link rel="stylesheet" href="trainers.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">Fitness Center</div>

      <nav class="nav">
        <p class="nav-label">Overview</p>
        <a href="#" class="nav-link"><span class="ico">⌂</span>Dashboard</a>
        <a href="#" class="nav-link"><span class="ico">👥</span>Members</a>
        <a href="#" class="nav-link"><span class="ico">✔</span>Attendance</a>
        <a href="#" class="nav-link active" aria-current="page"><span class="ico">🏋</span>Trainers</a>
        <a href="#" class="nav-link"><span class="ico">📅</span>Classes</a>

        <p class="nav-label business">Business</p>
        <a href="#" class="nav-link"><span class="ico">💳</span>Payments</a>
        <a href="#" class="nav-link"><span class="ico">🎟</span>Membership Plans</a>
        <a href="#" class="nav-link"><span class="ico">📄</span>Reports</a>
      </nav>

      <div class="profile">
        <div class="avatar sm">GV</div>
        <div>
          <div class="profile-name">Greg V.</div>
          <div class="profile-role">Administrator</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="page-head">
        <div>
          <h1 class="page-title">Trainers</h1>
          <p class="page-sub" id="summary"></p>
        </div>
        <button class="btn btn-grad btn-lg" id="addTrainer">+ Add trainer</button>
      </header>

      <!-- Toolbar -->
      <div class="toolbar">
        <label class="pill search" aria-label="Search trainer">
          <input type="search" id="search" placeholder="Search trainer" autocomplete="off" />
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </label>
        <label class="pill select" aria-label="Filter by class type">
          <select id="filter"></select>
        </label>

        <div class="bulk" id="bulk" hidden>
          <span id="bulkCount"></span>
          <button class="link-btn" id="bulkToggle">Deactivate</button>
          <button class="link-btn danger" id="bulkDelete">Delete</button>
          <button class="link-btn muted" id="bulkClear">Clear</button>
        </div>
      </div>

      <!-- List -->
      <section class="panel">
        <div class="list" id="list"></div>
        <p class="empty" id="empty" hidden>No trainers match your search.</p>

        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </main>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="form" novalidate>
      <h2 id="modalTitle">Add trainer</h2>

      <label>Full name
        <input type="text" id="fName" maxlength="40" required />
      </label>

      <label>Class type / specialty
        <input type="text" id="fSpec" list="specList" maxlength="30" required placeholder="e.g. HIIT &amp; Strength" />
        <datalist id="specList"></datalist>
      </label>

      <label>Classes per week
        <input type="number" id="fClasses" min="0" max="40" value="0" />
      </label>

      <p class="error" id="formError" role="alert"></p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-grad">Save</button>
      </div>
    </form>
  </div>

  <!-- Delete confirm -->
  <div class="modal" id="confirm" hidden>
    <div class="modal-box small">
      <h2>Delete trainer?</h2>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo">Cancel</button>
        <button class="btn btn-grad" id="confirmYes">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="trainers.js"></script>
</body>
</html>
