<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Center — Login</title>
<style>
  :root{
    --bg-deep:#1a0800;
    --bg-mid:#3b0f00;
    --flare:#f5b03c;
    --flare-soft:#e08a2b;
    --card-glass:rgba(255,255,255,0.08);
    --card-border:rgba(255,255,255,0.18);
    --text-main:#fdf6ee;
    --text-sub:rgba(253,246,238,0.65);
    --accent-a:#ff4d1c;
    --accent-b:#ffb703;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 78% 45%, var(--flare) 0%, var(--flare-soft) 18%, transparent 45%),
      radial-gradient(circle at 20% 80%, #ff5a1f22 0%, transparent 40%),
      linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #240a00 100%);
  }

  /* subtle vignette */
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
  }

  .brand{
    position:absolute;
    top:32px;
    left:36px;
    color:var(--text-main);
    font-size:13px;
    letter-spacing:6px;
    font-weight:600;
    text-transform:uppercase;
    opacity:0.85;
  }

  /* silhouette placeholder in place of the photo */
  .figure{
    position:absolute;
    left:-40px;
    bottom:0;
    width:min(46vw, 480px);
    height:88vh;
    background:
      linear-gradient(180deg, #000000cc 0%, #1a0b0344 60%, transparent 100%),
      radial-gradient(ellipse at 40% 30%, #7a3410 0%, #2b0f04 65%, transparent 80%);
    clip-path: polygon(30% 0%, 70% 0%, 78% 15%, 85% 40%, 90% 65%, 78% 85%, 82% 100%, 18% 100%, 22% 85%, 10% 65%, 15% 40%, 22% 15%);
    opacity:0.9;
    filter: blur(0.3px);
  }

  .card{
    position:relative;
    z-index:2;
    width:380px;
    padding:44px 40px 36px;
    background:linear-gradient(160deg, rgba(120,90,20,0.28), rgba(20,10,5,0.35));
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border:1px solid var(--card-border);
    border-radius:18px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .card h1{
    text-align:center;
    color:var(--text-main);
    font-size:22px;
    font-weight:700;
    margin-bottom:28px;
    letter-spacing:0.3px;
  }

  .field{
    margin-bottom:22px;
  }

  .field label{
    display:block;
    font-size:13px;
    color:var(--text-sub);
    margin-bottom:8px;
  }

  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(255,255,255,0.35);
    color:var(--text-main);
    font-size:14px;
    padding:6px 2px 10px;
    outline:none;
    transition:border-color .2s ease;
  }

  .field input::placeholder{
    color:rgba(255,255,255,0.35);
  }

  .field input:focus{
    border-bottom-color:var(--accent-b);
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:26px;
  }

  .remember input[type="checkbox"]{
    width:15px;
    height:15px;
    accent-color:var(--accent-b);
    cursor:pointer;
  }

  .remember label{
    font-size:13px;
    color:var(--text-sub);
    cursor:pointer;
  }

  .btn-login{
    width:100%;
    padding:13px;
    border:none;
    border-radius:24px;
    background:linear-gradient(90deg, var(--accent-a), var(--accent-b));
    color:#1a0800;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,90,20,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 26px rgba(255,90,20,0.45);
  }

  .btn-login:active{
    transform:translateY(0);
  }

  .signup{
    text-align:center;
    margin-top:16px;
    font-size:12.5px;
    color:var(--text-sub);
  }

  .signup a{
    color:var(--text-main);
    font-weight:700;
    text-decoration:none;
  }

  .signup a:hover{
    text-decoration:underline;
  }

  .error{
    display:none;
    color:#ffb4a6;
    font-size:12.5px;
    text-align:center;
    margin-top:-10px;
    margin-bottom:16px;
  }

  @media (max-width:520px){
    .figure{display:none;}
    .card{width:88vw;padding:36px 26px;}
    .brand{left:20px;top:20px;}
  }
</style>
</head>
<body>

  <div class="brand">Fitness Center</div>
  <div class="figure" aria-hidden="true"></div>

  <form class="card" id="loginForm" novalidate>
    <h1>Welcome Back!</h1>

    <div class="field">
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" placeholder="Enter username or email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>

    <p class="error" id="errorMsg">Please fill in both fields.</p>

    <div class="remember">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Remember me</label>
    </div>

    <button type="submit" class="btn-login">Log In</button>

    <p class="signup">Don't have an account? <a href="#" id="signupLink">Sign Up</a></p>
  </form>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if(!username || !password){
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';

    // Replace this with a real authentication request (e.g. fetch('/api/login', {...}))
    console.log('Logging in with:', {
      username,
      remember: document.getElementById('remember').checked
    });
    alert('Login submitted for: ' + username);
  });

  document.getElementById('signupLink').addEventListener('click', function(e){
    e.preventDefault();
    alert('Redirect to sign-up page here.');
  });
</script>

</body>
</html>
