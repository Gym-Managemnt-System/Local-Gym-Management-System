<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> RESET Fitness Center — Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="brand">Fitness Center</div>
  <div class="figure" aria-hidden="true"></div>

  <!-- LOGIN FORM VIEW -->
  <div class="form-panel active" id="login-view">
    <div class="form-card">
      <h2>Welcome back!</h2>
      <div class="form-error" id="login-error">Enter a valid email and password.</div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" />
          <span class="field-error" id="login-email-error"></span>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <svg class="icon-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/><path d="M6.61 6.61A18.5 18.5 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"/></svg>
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="login-password-error"></span>
        </div>
        <div class="remember-row">
          <div class="remember">
            <input type="checkbox" id="login-remember" />
            <label for="login-remember">Remember me</label>
          </div>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>
        <button type="submit" class="btn-submit">Log In</button>
      </form>
      <div class="switch-line">
        Need an account? Contact your gym administrator.
      </div>
    </div>
  </div>

  <a class="back-btn" href="front.html">← Back</a>

<script src="script.js"></script>

</body>
</html>
