<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESET Fitness Center — Manual Check-in</title>
<link rel="stylesheet" href="checkin.css">
</head>
<body>

  <div class="brand">Fitness Center</div>

  <form class="card" id="checkinForm" novalidate>
    <h1>Mannual check-in</h1>
    <p class="lead">For members without a card or app</p>

    <div class="field">
      <label for="searchMember">Search member</label>
      <input type="text" id="searchMember" name="searchMember" placeholder="Type a name..." required>
    </div>

    <div class="field">
      <label for="checkinTime">Check-in time</label>
      <input type="time" id="checkinTime" name="checkinTime" required>
    </div>

    <div class="field">
      <label for="note">Note (Optional)</label>
      <input type="text" id="note" name="note" placeholder="e.g. forgot card">
    </div>

    <p class="error" id="errorMsg">Please select a member and check-in time.</p>

    <div class="btn-row">
      <a href="attendance.html" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-confirm">Confirm check-in</button>
    </div>
  </form>

<script src="checkin-script.js"></script>

</body>
</html>
