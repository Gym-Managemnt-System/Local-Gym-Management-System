<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESET Fitness Center — Plan Schedule</title>
<link rel="stylesheet" href="plan-schedule.css">
</head>
<body>

  <div class="brand">Fitness Center</div>
  <a href="classes.html" class="back-link">← Back to Classes</a>
  <div class="figure" aria-hidden="true"></div>

  <form class="card" id="scheduleForm" novalidate>
    <h1>Schedule a class</h1>

    <div class="field">
      <label for="className">Class name</label>
      <input type="text" id="className" name="className" placeholder="e.g. HIIT Circuit" required>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="classTime">Time</label>
        <input type="time" id="classTime" name="classTime" required>
      </div>
      <div class="field">
        <label for="classType">Class Type</label>
        <div class="custom-select" id="classTypeSelect">
          <button type="button" class="custom-select-trigger" id="classTypeTrigger">
            <span id="classTypeValue">Select</span>
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <ul class="custom-select-options" id="classTypeOptions">
            <li data-value="">Select</li>
            <li data-value="hiit">HIIT</li>
            <li data-value="yoga">Yoga</li>
            <li data-value="strength">Strength</li>
            <li data-value="cardio">Cardio</li>
          </ul>
        </div>
        <input type="hidden" id="classTypeInput" name="classType" required>
      </div>
    </div>

    <div class="field">
      <label for="trainer">Trainer</label>
      <div class="custom-select" id="trainerSelect">
        <button type="button" class="custom-select-trigger" id="trainerTrigger">
          <span id="trainerValue">Select</span>
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <ul class="custom-select-options" id="trainerOptions">
          <li data-value="">Loading trainers…</li>
        </ul>
      </div>
      <input type="hidden" id="trainerInput" name="trainer" required>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="duration">Duration (min)</label>
        <input type="number" id="duration" name="duration" placeholder="45" min="1">
      </div>
      <div class="field">
        <label for="capacity">Max capacity</label>
        <input type="number" id="capacity" name="capacity" placeholder="20" min="1">
      </div>
    </div>

    <p class="error" id="errorMsg">Please fill in all required fields.</p>

    <button type="submit" class="btn-create">Create class</button>
  </form>

<script src="plan-schedule-script.js"></script>
</body>
</html>
