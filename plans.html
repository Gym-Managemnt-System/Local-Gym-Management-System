<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Plans | Fitness Center</title>
  <link rel="stylesheet" href="plans.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">Fitness Center</div>

      <nav class="nav">
        <p class="nav-label">Overview</p>
        <a href="#" class="nav-link"><span class="ico">⌂</span>Dashboard</a>
        <a href="#" class="nav-link"><span class="ico">👥</span>Members</a>
        <a href="#" class="nav-link"><span class="ico">✔</span>Attendance</a>
        <a href="#" class="nav-link"><span class="ico">🏋</span>Trainers</a>
        <a href="#" class="nav-link"><span class="ico">📅</span>Classes</a>

        <p class="nav-label business">Business</p>
        <a href="#" class="nav-link"><span class="ico">💳</span>Payments</a>
        <a href="#" class="nav-link active" aria-current="page"><span class="ico">🎟</span>Membership Plans</a>
        <a href="#" class="nav-link"><span class="ico">📄</span>Reports</a>
      </nav>

      <div class="profile">
        <div class="avatar">GV</div>
        <div>
          <div class="profile-name">Greg V.</div>
          <div class="profile-role">Administrator</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="page-head">
        <div>
          <h1 class="page-title">Membership Plans</h1>
          <p class="page-sub" id="summary"></p>
        </div>
        <button class="btn btn-grad" id="addPlan">+ Add plan</button>
      </header>

      <section class="plans-panel">
        <div class="plans" id="plans"></div>
        <p class="empty" id="empty" hidden>No active plans. Click “Add plan” to create one.</p>
      </section>
    </main>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="planForm" novalidate>
      <h2 id="modalTitle">Edit plan</h2>

      <label>Plan name
        <input type="text" id="fName" required maxlength="30" />
      </label>

      <div class="row">
        <label>Price (Rs / month)
          <input type="number" id="fPrice" min="0" step="50" required />
        </label>
        <label>Billing note
          <input type="text" id="fBilling" maxlength="40" placeholder="Billed monthly | no lock-in" />
        </label>
      </div>

      <label>Features <small>(one per line)</small>
        <textarea id="fFeatures" rows="4"></textarea>
      </label>

      <label class="check">
        <input type="checkbox" id="fPopular" /> Mark as “Most popular”
      </label>

      <p class="error" id="formError" role="alert"></p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-grad">Save</button>
      </div>
    </form>
  </div>

  <!-- Archive confirm -->
  <div class="modal" id="confirm" hidden>
    <div class="modal-box small">
      <h2>Archive plan?</h2>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo">Cancel</button>
        <button class="btn btn-grad" id="confirmYes">Archive</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="plans.js"></script>
</body>
</html>
